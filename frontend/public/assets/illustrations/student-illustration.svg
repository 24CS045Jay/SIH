<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <circle cx="200" cy="200" r="180" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Book -->
  <rect x="120" y="240" width="160" height="120" rx="8" fill="#8b5cf6" opacity="0.2"/>
  <rect x="125" y="245" width="150" height="110" rx="6" fill="#8b5cf6" opacity="0.3"/>
  <line x1="200" y1="245" x2="200" y2="355" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  
  <!-- Backpack -->
  <rect x="280" y="180" width="60" height="80" rx="8" fill="#f5c451" opacity="0.3"/>
  <rect x="285" y="185" width="50" height="70" rx="6" fill="#f5c451" opacity="0.4"/>
  <circle cx="310" cy="200" r="8" fill="#f5c451" opacity="0.5"/>
  
  <!-- Tablet/Device -->
  <rect x="90" y="180" width="80" height="100" rx="8" fill="#8b5cf6" opacity="0.4"/>
  <rect x="95" y="185" width="70" height="85" rx="4" fill="#ffffff" opacity="0.2"/>
  <line x1="100" y1="195" x2="160" y2="195" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="205" x2="160" y2="205" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="215" x2="140" y2="215" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  
  <!-- Person silhouette (simplified) -->
  <circle cx="200" cy="120" r="30" fill="#8b5cf6" opacity="0.3"/>
  <ellipse cx="200" cy="180" rx="40" ry="50" fill="#8b5cf6" opacity="0.25"/>
  
  <!-- Floating icons -->
  <circle cx="80" cy="100" r="15" fill="#f5c451" opacity="0.2"/>
  <text x="73" y="108" font-size="18" opacity="0.6">📚</text>
  
  <circle cx="320" cy="120" r="15" fill="#8b5cf6" opacity="0.2"/>
  <text x="313" y="128" font-size="18" opacity="0.6">🎓</text>
  
  <circle cx="340" cy="280" r="12" fill="#f5c451" opacity="0.2"/>
  <text x="335" y="287" font-size="16" opacity="0.5">💡</text>
  
  <circle cx="60" cy="280" r="12" fill="#34d399" opacity="0.2"/>
  <text x="55" y="287" font-size="16" opacity="0.5">✨</text>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c451;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>
