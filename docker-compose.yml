services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kmrl
      POSTGRES_PASSWORD: kmrl
      POSTGRES_DB: kmrl_portal
    ports:
      - "5432:5432"
    volumes:
      - kmrl_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  kmrl_postgres_data:
