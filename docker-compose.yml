services:
  postgres:
    # pgvector/pgvector:pg16 adds the pgvector extension pre-installed.
    # If you had local data in kmrl_postgres_data, remove the volume first:
    #   docker volume rm sih_kmrl_postgres_data
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kmrl
      POSTGRES_PASSWORD: kmrl
      POSTGRES_DB: kmrl_portal
    ports:
      - "5432:5432"
    volumes:
      - kmrl_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  kmrl_postgres_data:
