services:
  - type: web
    name: kmrl-document-intelligence-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kmrl-document-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kmrl-document-intelligence-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: kmrl-document-intelligence-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: kmrl-document-intelligence-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PATH
        value: /app/storage

  - type: worker
    name: kmrl-document-intelligence-worker
    runtime: docker
    rootDir: backend
    plan: starter
    dockerCommand: celery -A app.jobs.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kmrl-document-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kmrl-document-intelligence-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: kmrl-document-intelligence-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: kmrl-document-intelligence-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: kmrl-document-intelligence-api
          envVarKey: JWT_SECRET
      - key: STORAGE_PATH
        value: /app/storage

  - type: redis
    name: kmrl-document-intelligence-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: kmrl-document-intelligence-db
    plan: starter
    databaseName: kmrl_portal
    user: kmrl
