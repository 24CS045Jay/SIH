services:
  # FastAPI backend service
  - type: web
    name: kmrl-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kmrl-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kmrl-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: STORAGE_PATH
        value: ./storage
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: LOW_OCR_CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: INTELLIGENCE_LLM_ENABLED
        value: "false"
      - key: INTELLIGENCE_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: https://kmrl-portal.vercel.app

  # Redis for background queue / Celery
  - type: redis
    name: kmrl-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # PostgreSQL database with pgvector support
  - name: kmrl-postgres
    plan: free
    region: oregon
    databaseName: kmrl_portal
    user: kmrl
    ipAllowList: []
